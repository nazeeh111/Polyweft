<svg xmlns="http://www.w3.org/2000/svg" width="420" height="878" viewBox="0 0 420 878" role="img" aria-labelledby="title desc">
<title id="title">Polyweft: merge values, inspect surfaces, verify native output</title>
<desc id="desc">Ancestor, left and right scenes form a source-bound merge plan. Independent edits combine; each competing value requires a complete ancestor, left or right choice. Configured values feed optional four-state surface inspection and separate native apply. Inspection never saves a scene and becomes stale when choices change. Apply recaptures sources, saves a temporary scene and reopens and checks it before publishing a new blend file without overwrite. Surface inspection is not an apply gate or geometric guarantee.</desc>
<rect width="420" height="878" fill="#17191d" rx="6"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#bfc8d3" stroke-width="1.4"/></marker></defs>
<text id="heading" x="22" y="34" fill="#f4f5f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">From branch edits</text>
<text id="heading-2" x="22" y="64" fill="#f4f5f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">to a new .blend</text>
<text id="subheading" x="22" y="94" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">A decision is not a saved scene.</text>
<rect id="scene-0" x="22" y="118" width="118" height="43" fill="#202328" stroke="#84909e" rx="4"/>
<text id="scene-label-0" x="36" y="146" fill="#84909e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Ancestor</text>
<path id="scene-to-plan-0" d="M81 161V186H210V208" fill="none" stroke="#bfc8d3" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="scene-1" x="151" y="118" width="118" height="43" fill="#202328" stroke="#ff8976" rx="4"/>
<text id="scene-label-1" x="165" y="146" fill="#ff8976" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Left</text>
<path id="scene-to-plan-1" d="M210 161V186H210V208" fill="none" stroke="#bfc8d3" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="scene-2" x="280" y="118" width="118" height="43" fill="#202328" stroke="#55d6e8" rx="4"/>
<text id="scene-label-2" x="294" y="146" fill="#55d6e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Right</text>
<path id="scene-to-plan-2" d="M339 161V186H210V208" fill="none" stroke="#bfc8d3" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="review" x="22" y="208" width="376" height="137" fill="#202328" stroke="#84909e" rx="4"/>
<text id="review-title" x="40" y="238" fill="#f4f5f7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Review the source-bound plan</text>
<text id="review-rule-0" x="40" y="267" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Keep independent edits. For each competing</text>
<text id="review-rule-1" x="40" y="293" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">field, choose its whole ancestor, left or right</text>
<text id="review-rule-2" x="40" y="319" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">value. Prepared identities; same topology.</text>
<path id="review-to-values" d="M210 345V376" fill="none" stroke="#bfc8d3" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="values" x="22" y="376" width="376" height="96" fill="#202328" stroke="#f3e36b" rx="4"/>
<text id="values-title" x="40" y="406" fill="#f3e36b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Configured values</text>
<text id="values-detail-0" x="40" y="433" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">XYZ, UV, material defaults. All else: right.</text>
<path id="values-to-inspect" d="M124 472V502" fill="none" stroke="#bfc8d3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path id="values-to-apply" d="M304 472V674" fill="none" stroke="#bfc8d3" stroke-width="2" marker-end="url(#arrow)"/>
<rect id="inspect" x="22" y="502" width="245" height="144" fill="#202328" stroke="#84909e" rx="4"/>
<text id="inspect-label" x="38" y="527" fill="#f3e36b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">OPTIONAL INSPECTION</text>
<text id="inspect-detail-0" x="38" y="554" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Ancestor · left · right</text>
<text id="inspect-detail-1" x="38" y="578" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">· combined surface</text>
<text id="inspect-detail-2" x="38" y="602" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Report only; no scene saved.</text>
<text id="inspect-detail-3" x="38" y="626" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">New choices need reinspection.</text>
<rect id="apply" x="22" y="674" width="376" height="145" fill="#202328" stroke="#84909e" rx="4"/>
<text id="apply-title" x="40" y="703" fill="#f4f5f7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Native apply</text>
<text id="apply-detail-0" x="40" y="731" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Recapture → save temp → reopen + check.</text>
<text id="apply-detail-1" x="40" y="757" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">New .blend only after payload/guard checks.</text>
<text id="apply-detail-2" x="40" y="783" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Existing output paths are refused.</text>
<text id="limits-1" x="22" y="848" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Inspection neither gates apply nor repairs geometry.</text>
<text id="limits-2" x="22" y="869" fill="#bfc8d3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">It can be incomplete; it is not a validity guarantee.</text>
</svg>
